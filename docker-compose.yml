name: stackr

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-stockmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      # Postgres 18+ images expect the mount one level up from `data`, so that
      # data lives in a major-version subdirectory and pg_upgrade --link works.
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    # Not published to the host in production; uncomment for local psql access.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockmonitor} -d ${POSTGRES_DB:-stockmonitor}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Container-internal overrides (win over .env values aimed at host dev).
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockmonitor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockmonitor}
    volumes:
      - ./database/migrations:/app/database/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "docker-healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
