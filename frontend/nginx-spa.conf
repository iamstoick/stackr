# Static file server for the built SPA. The public Nginx proxies to this.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or a deploy would keep serving stale JS.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: unknown paths render the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
